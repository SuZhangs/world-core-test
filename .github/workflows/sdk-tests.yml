name: SDK Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sdk-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run openapi:export
      - run: npm run sdk:test
